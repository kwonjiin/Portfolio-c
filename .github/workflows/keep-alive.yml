name: Keep Render backend awake

on:
  schedule:
    # 10분마다 실행 (Render 무료 플랜은 15분간 요청이 없으면 슬립됩니다)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: curl -sf https://portfolio-c-9inp.onrender.com/api/health
